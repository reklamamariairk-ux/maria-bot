# Российский вход для VK Mini App.
# Сервер приложения остаётся общим, но внешний адрес и IP — российские.
server {
  listen 80;
  server_name bot.186-246-14-117.sslip.io;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name bot.186-246-14-117.sslip.io;
  ssl_certificate /etc/letsencrypt/live/bot.186-246-14-117.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bot.186-246-14-117.sslip.io/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
