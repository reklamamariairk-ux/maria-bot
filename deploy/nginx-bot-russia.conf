# Российский вход для VK Mini App / «Котик Комбат».
# Файл подключается из nginx.conf внутри блока http {}.

proxy_cache_path /var/cache/nginx/maria-static
  levels=1:2 keys_zone=maria_static:32m max_size=2g inactive=7d use_temp_path=off;

map $arg_v $maria_asset_cache_control {
  default "public, max-age=3600";
  ~.+     "public, max-age=31536000, immutable";
}

upstream maria_game_api {
  server 127.0.0.1:3010 max_fails=3 fail_timeout=10s;
  # Раскомментировать только после запуска и проверки второй API-реплики.
  # server 127.0.0.1:3011 max_fails=3 fail_timeout=10s;
  keepalive 64;
}
server {
  listen 80;
  server_name bot.186-246-14-117.sslip.io;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name bot.186-246-14-117.sslip.io;
  ssl_certificate /etc/letsencrypt/live/bot.186-246-14-117.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bot.186-246-14-117.sslip.io/privkey.pem;

  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /live {
    proxy_pass http://maria_game_api;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  location = /ready {
    proxy_pass http://maria_game_api;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
  }

  # HTML всегда перепроверяется; он переключает версии ?v= статических файлов.
  location ~* ^/(?:game\.html|index\.html)?$ {
    proxy_pass http://maria_game_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
  }

  # Первый запрос забирает файл у Node, следующие обслуживает nginx без Node.
  # Наличие ?v= делает JS/CSS immutable; неверсированные изображения живут час.
  location ~* ^/(?:js|css|assets)/.+\.(?:js|css|png|jpe?g|webp|gif|svg|ico|mp4|webm|woff2?)$ {
    proxy_pass http://maria_game_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache maria_static;
    proxy_cache_lock on;
    proxy_cache_valid 200 1h;
    proxy_cache_valid 404 1m;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $maria_asset_cache_control always;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  location = /api/chat-stream {
    proxy_pass http://maria_game_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
  }

  location / {
    proxy_pass http://maria_game_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
}
