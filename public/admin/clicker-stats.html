<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Котик Комбат — аналитика</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap&subset=cyrillic,latin" rel="stylesheet">
<style>
  :root{
    --bg:#16110f; --panel:#211a17; --panel2:#2a211d; --line:rgba(255,255,255,.08);
    --ink:#f1ece6; --muted:#9a9088; --gold:#f0c24e; --gold-l:#ffe39c; --gold-d:#c2882a;
    --pos:#5bb58a; --accent:#f0566a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(130% 90% at 50% -10%,#2a211d 0%,#16110f 60%);color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;min-height:100vh;padding:24px 16px 60px}
  .wrap{max-width:1060px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:24px;font-weight:900;margin:0;letter-spacing:.2px}
  h1 .cat{color:var(--gold-l)}
  .sub{color:var(--muted);font-size:13px;font-weight:700}
  .bar{margin:14px 0 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .bar input{background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    padding:9px 13px;font:600 13px 'Nunito';min-width:230px}
  .bar button{background:linear-gradient(180deg,#ffe7a6,#cf9a36);border:none;border-radius:11px;color:#5a2028;
    font:800 13px 'Nunito';padding:10px 18px;cursor:pointer}
  .bar .st{color:var(--muted);font-size:12.5px;font-weight:700}
  .sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:26px 4px 11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px}
  .kpi .l{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:29px;margin-top:7px;font-variant-numeric:tabular-nums;color:var(--gold-l)}
  .kpi .d{color:var(--muted);font-size:11.5px;font-weight:700;margin-top:3px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.cols{grid-template-columns:1fr}}
  /* столбчатый график */
  .chart{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:6px}
  .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
  .chart .bk{width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold-d));min-height:2px;transition:height .4s}
  .chart .bk.t{background:linear-gradient(180deg,#7fb6ff,#3f6fb0)}
  .chart .dd{color:var(--muted);font-size:9px;font-weight:700;font-family:'JetBrains Mono';white-space:nowrap;transform:rotate(-45deg);transform-origin:center;height:14px}
  .legend{display:flex;gap:16px;margin-top:14px;color:var(--muted);font-size:12px;font-weight:700}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  /* горизонтальные бары (воронка / уровни) */
  .rows{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .row{display:grid;grid-template-columns:120px 1fr 62px;gap:10px;align-items:center}
  .row .n{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .track{background:rgba(0,0,0,.3);border-radius:7px;height:18px;overflow:hidden}
  .row .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));min-width:2px;transition:width .5s}
  .row .val{font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;text-align:right;color:var(--gold-l);font-variant-numeric:tabular-nums}
  .row .val small{color:var(--muted);font-weight:600}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:800}
  td.num{font-family:'JetBrains Mono';text-align:right;font-variant-numeric:tabular-nums;color:var(--gold-l);font-weight:700}
  .err{color:var(--accent);font-weight:700;font-size:14px;padding:14px 0}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffe39c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><circle cx="8" cy="7" r="1.6" fill="#ffe39c"/><circle cx="15.5" cy="6" r="1.6" fill="#ffe39c"/><circle cx="19" cy="10.5" r="1.4" fill="#ffe39c"/><circle cx="4.5" cy="11" r="1.4" fill="#ffe39c"/><path d="M12 12c-2.4 0-4.3 1.7-4.9 3.6-.5 1.7.8 3 2.6 3 .9 0 1.6-.4 2.3-.4s1.4.4 2.3.4c1.8 0 3.1-1.3 2.6-3C16.3 13.7 14.4 12 12 12z" fill="#ffe39c" stroke="none"/></svg> Котик Комбат — аналитика</h1>
    <span class="sub" id="meta"></span>
  </header>
  <div class="bar">
    <input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
    <button id="go">Показать</button>
    <span class="st" id="st"></span>
  </div>
  <div id="root"></div>
</div>
<script>
const $ = (s,r=document)=>r.querySelector(s);
const fmt = (n)=> new Intl.NumberFormat('ru-RU').format(Math.round(n||0));
const esc = (v)=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const root = $('#root');
const TOKKEY = 'ck_stats_token';
$('#tok').value = sessionStorage.getItem(TOKKEY) || '';
localStorage.removeItem(TOKKEY);

async function load(){
  const tok = $('#tok').value.trim();
  if(!tok){ $('#st').textContent='Введите токен'; return; }
  sessionStorage.setItem(TOKKEY, tok);
  $('#st').textContent='Загрузка…'; root.innerHTML='';
  let d;
  try{
    const r = await fetch('/api/clicker/stats', {headers:{'X-User-Token':tok}});
    if(r.status===403){ $('#st').textContent='Неверный токен'; return; }
    if(!r.ok){ $('#st').textContent='Ошибка '+r.status; return; }
    d = await r.json();
  }catch(e){ $('#st').textContent='Сеть недоступна'; return; }
  $('#st').textContent='';
  render(d);
}

function kpi(l,v,sub){ return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${sub?`<div class="d">${sub}</div>`:''}</div>`; }

function chart(series){
  const maxD = Math.max(1, ...series.map(s=>s.dau));
  const maxT = Math.max(1, ...series.map(s=>s.taps));
  const cols = series.map(s=>{
    const dh = Math.round(s.dau/maxD*100), th = Math.round(s.taps/maxT*100);
    const dd = s.day.slice(8)+'.'+s.day.slice(5,7);
    return `<div class="col" title="${esc(s.day)}\nDAU: ${fmt(s.dau)}\nТапы: ${fmt(s.taps)}\nНовых: ${fmt(s.newUsers)}">
      <div style="flex:1;display:flex;align-items:flex-end;gap:2px;width:100%">
        <div class="bk" style="height:${dh}%"></div>
        <div class="bk t" style="height:${th}%"></div>
      </div>
      <div class="dd">${esc(dd)}</div></div>`;
  }).join('');
  return `<div class="chart">${cols}</div>
    <div class="legend"><span><i style="background:linear-gradient(180deg,#f0c24e,#c2882a)"></i>DAU</span>
    <span><i style="background:linear-gradient(180deg,#7fb6ff,#3f6fb0)"></i>Тапы</span></div>`;
}

function hrows(items, total){
  const max = Math.max(1, ...items.map(i=>i.count));
  return `<div class="rows">`+items.map(i=>{
    const pct = total ? Math.round(i.count/total*100) : null;
    return `<div class="row"><div class="n" title="${esc(i.name)}">${esc(i.name)}</div>
      <div class="track"><div class="fill" style="width:${Math.round(i.count/max*100)}%"></div></div>
      <div class="val">${fmt(i.count)}${pct!=null?` <small>${pct}%</small>`:''}</div></div>`;
  }).join('')+`</div>`;
}

function render(d){
  const r = d.retention;
  const ret = (v,c)=> c>0 ? v+'%' : '<span class="muted">н/д</span>';
  const html = `
    <div class="sect">Аудитория</div>
    <div class="grid">
      ${kpi('Всего игроков', fmt(d.totals.players))}
      ${kpi('DAU сегодня', fmt(d.active.dauToday), 'вчера '+fmt(d.active.dauYesterday))}
      ${kpi('WAU (7 дней)', fmt(d.active.wau))}
      ${kpi('MAU (30 дней)', fmt(d.active.mau))}
      ${kpi('Новых сегодня', fmt(d.totals.newToday), 'за 7д '+fmt(d.totals.new7d)+' · 30д '+fmt(d.totals.new30d))}
    </div>

    <div class="sect">Вовлечённость</div>
    <div class="grid">
      ${kpi('Тапов сегодня', fmt(d.taps.today), 'за 7д '+fmt(d.taps.last7d))}
      ${kpi('Retention D1', ret(r.d1,r.d1Cohort), 'когорта '+fmt(r.d1Cohort))}
      ${kpi('Retention D7', ret(r.d7,r.d7Cohort), 'когорта '+fmt(r.d7Cohort))}
    </div>

    <div class="sect">Динамика · 14 дней</div>
    <div class="panel">${chart(d.series)}</div>

    <div class="sect">Воронка и прогресс</div>
    <div class="cols">
      <div class="panel">
        <div class="l muted" style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Воронка · 30 дней (доля от активных)</div>
        ${hrows([
          {name:'Активные', count:d.funnel.players},
          {name:'Награда дня', count:d.funnel.daily},
          {name:'Мини-игры', count:d.funnel.game},
          {name:'Обмен наград', count:d.funnel.redeem},
          {name:'Привёл друга', count:d.funnel.ref},
        ], d.funnel.players)}
      </div>
      <div class="panel">
        <div class="l muted" style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Игроки по уровням</div>
        ${d.levels.length ? hrows(d.levels.map(l=>({name:'Ур.'+l.level+' · '+l.name, count:l.count})), d.totals.players) : '<div class="muted">—</div>'}
      </div>
    </div>

    <div class="sect">События · 7 дней</div>
    <div class="panel">
      ${d.events7d.length ? `<table><thead><tr><th>Событие</th><th style="text-align:right">Кол-во</th></tr></thead><tbody>
        ${d.events7d.map(e=>`<tr><td>${esc(EVT[e.event]||e.event)}</td><td class="num">${fmt(e.count)}</td></tr>`).join('')}
      </tbody></table>` : '<div class="muted">Пока нет событий за период</div>'}
    </div>
  `;
  root.innerHTML = html;
  const dt = new Date(d.generatedAt);
  $('#meta').textContent = 'обновлено '+dt.toLocaleString('ru-RU')+' · '+d.tz;
}

const EVT = {
  levelup:'Повышение уровня', daily:'Награда дня', game:'Мини-игра', combo:'Комбо дня',
  cipher:'Шифр дня', chest:'Сундук', rain:'Золотой дождь', bonus:'Золотой бонус',
  boost:'Буст', buy:'Покупка апгрейда', redeem:'Обмен награды', code:'Промокод',
  ref:'Реферал', milestone:'Веха (баллы клуба)', task:'Задание', migrate:'Гость→аккаунт',
};

$('#go').onclick = load;
$('#tok').addEventListener('keydown', e=>{ if(e.key==='Enter') load(); });
if($('#tok').value) load();
</script>
</body>
</html>
